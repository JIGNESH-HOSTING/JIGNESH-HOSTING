name: Build AZYRON CLIENT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned MixinSquared artifact metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.request
          url = 'https://maven.bawnorton.com/releases/com/github/bawnorton/mixinsquared/mixinsquared-fabric/0.3.7/mixinsquared-fabric-0.3.7.jar'
          request = urllib.request.Request(url, headers={'User-Agent': 'AZYRON-CLIENT/1.0 dependency-verifier'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
          except Exception as error:
              print(f'::error title=MixinSquared download failed::{type(error).__name__}: {error}')
              raise
          sha1 = hashlib.sha1(data).hexdigest()
          sha512 = hashlib.sha512(data).hexdigest()
          if sha1 != '5127cfe96a31e8d0ede547e4e6518fbc61bef8d2' or sha512 != 'a38a43c43b5d1aee4f8530da5dafbc2eaf619c67922d079fa4f8ccd11864a8c7e91daf8cde6de9849f6fa138483958e8e12cef7ec4f4d3fa4ff6818a80918f58':
              print(f'::error title=MixinSquared checksum mismatch::size={len(data)} sha1={sha1} sha512={sha512}')
              raise SystemExit(1)
          print(f'::notice title=MixinSquared artifact::size={len(data)} sha1={sha1} sha512={sha512}')
          PY

      - name: Build Fabric mod and packages
        run: |
          if ! ./gradlew --no-daemon --stacktrace build buildMrpack buildBundleZip > build.log 2>&1; then
            tail -n 120 build.log
            message=$(sed -n '/^FAILURE: Build failed/,$p' build.log | head -n 35 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error title=Gradle build failure::%s\n' "$message"
            exit 1
          fi
          cat build.log

      - name: Verify archive structure
        run: |
          unzip -t build/libs/Azyron-Client-1.0.jar
          unzip -t release/Azyron-Client-1.0-Fabric-1.21.11.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('build/libs/Azyron-Client-1.0.jar') as jar:
              metadata = json.loads(jar.read('fabric.mod.json'))
              assert metadata['id'] == 'azyron_client'
              assert metadata['version'] == '1.0'
              assert metadata['depends']['minecraft'] == '1.21.11'
          with zipfile.ZipFile('release/Azyron-Client-1.0-Fabric-1.21.11.zip') as bundle:
              names = bundle.namelist()
              assert len([name for name in names if name.startswith('mods/') and name.endswith('.jar')]) == 12
              assert 'mods/Azyron-Client-1.0.jar' in names
              assert 'mods/mixinsquared-fabric-0.3.7.jar' in names
          print('Fabric metadata and 12 bundled mod jars verified.')
          PY

      - name: Install headless OpenGL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Check virtual OpenGL renderer
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" env LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B

      - name: Launch smoke test with software rendering
        id: client_smoke
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 150s xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" env LIBGL_ALWAYS_SOFTWARE=1 ./gradlew --no-daemon runClient > client-smoke.log 2>&1
          status=$?
          set -e
          cat client-smoke.log
          echo "runClient process status: $status"
          crash_report=$(find run/crash-reports -maxdepth 1 -name '*.txt' -print 2>/dev/null | sort | tail -n 1)
          crash_excerpt=""
          if [ -n "$crash_report" ]; then
            crash_excerpt=$(head -n 45 "$crash_report")
            echo "--- crash report header ---"
            printf '%s\n' "$crash_excerpt"
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && [ "$status" -ne 143 ]; then
            echo "runClient exited before the timeout."
            detail=$({ printf '%s\n' "$crash_excerpt"; grep -Ei 'error|exception|failed|GLFW|OpenGL' run/logs/latest.log 2>/dev/null | tail -n 20 || true; tail -n 15 client-smoke.log; } | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error title=runClient exited early::%s\n' "$detail"
            exit "$status"
          fi
          if ! grep -q "Sound engine started" run/logs/latest.log; then
            echo "Minecraft did not reach the sound-engine/title-screen startup marker."
            test ! -f run/logs/latest.log || tail -n 100 run/logs/latest.log
            tail -n 100 client-smoke.log
            detail=$({ printf '%s\n' "$crash_excerpt"; grep -Ei 'error|exception|failed|GLFW|OpenGL' run/logs/latest.log 2>/dev/null | tail -n 20 || true; tail -n 15 client-smoke.log; } | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error title=Client startup smoke test failed::%s\n' "$detail"
            exit 1
          fi
          echo "Minecraft client reached startup with the pinned Fabric mod stack."

      - name: Upload build outputs and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Azyron-Client-1.0-Minecraft-1.21.11
          path: |
            build/libs/Azyron-Client-1.0.jar
            build/libs/Azyron-Client-1.0-sources.jar
            release/Azyron-Client-1.0.mrpack
            release/Azyron-Client-1.0-Fabric-1.21.11.zip
            client-smoke.log
            run/logs/latest.log
            run/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 30
